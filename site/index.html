<!DOCTYPE html>
<!--
  C06 标定看板(GitHub Pages 版,工厂直接开网址看,无需任何令牌)
  数据 = 同目录 data.json,由 .github/workflows/c06-board.yml 在每台标定 run
  结束时(+定时兜底)重新聚合发布。页面每 60 秒拉一次带时间戳的 data.json 防 CDN 缓存。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C06 标定看板</title>
<style>
:root{
  --bg:#f3f5f3; --surface:#ffffff; --ink:#182220; --muted:#5f6d67; --line:#d9e0dc;
  --pass:#0c7a3d; --pass-bg:#e2f3e8; --pass-line:#b5dfc4;
  --fail:#b32316; --fail-bg:#fae8e5;
  --run:#96560a;  --run-bg:#fcf1dd;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; font-size:15px}
.wrap{max-width:1200px; margin:0 auto; padding:22px 24px 48px}
header{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px}
h1{font-size:24px; margin:0; letter-spacing:.03em}
.fresh{margin-left:auto; font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px}
.dot{width:9px; height:9px; border-radius:50%; background:var(--pass)}
.dot.bad{background:var(--fail)}
.tiles{display:flex; flex-wrap:wrap; gap:14px; margin:18px 0 22px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:14px 22px 12px; min-width:140px; flex:1 1 140px; max-width:220px}
.tile .n{font-size:44px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums}
.tile .l{font-size:14px; color:var(--muted); letter-spacing:.1em; margin-top:2px}
.tile.pass .n{color:var(--pass)} .tile.fail .n{color:var(--fail)} .tile.run .n{color:var(--run)}
h2{font-size:16px; color:var(--muted); font-weight:500; letter-spacing:.1em; margin:26px 0 10px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:10px}
.chip{border-radius:8px; padding:10px 14px; font-variant-numeric:tabular-nums;
  font-family:Consolas,"Courier New",monospace; font-size:19px; font-weight:600;
  display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.chip small{font-family:"Microsoft YaHei",sans-serif; font-size:11px; font-weight:400; opacity:.75}
.chip.pass{background:var(--pass-bg); color:var(--pass); border:1px solid var(--pass-line)}
/* 复检:今天又过了一遍线,但结果沿用之前那次合格(蓝色,标注原日期) */
.chip.pass.recheck{background:#e7f0fb; color:#1d4f91; border:1px solid #c3d8f0}
.chip.fail{background:var(--fail-bg); color:var(--fail); border:1px solid transparent}
.chip.run{background:var(--run-bg); color:var(--run); border:1px solid transparent}
.chip.run .b{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.chip.run .b{animation:none}}
.empty{color:var(--muted); padding:6px 2px}
.datehead{font-size:14px; color:var(--muted); margin:14px 0 8px; display:flex;
  align-items:baseline; gap:8px}
.datehead b{font-size:16px; color:var(--ink)}
.datehead.today b{color:var(--pass)}
.datehead .cnt{font-variant-numeric:tabular-nums}
/* 已合格区:按投料批次分块(同批 10 台并行同时开跑,tag 时间戳聚类) */
.batchhead{font-size:12.5px; color:var(--muted); margin:12px 0 6px;
  font-variant-numeric:tabular-nums}
.batchhead.re{color:#1d4f91}
.banner{background:var(--fail-bg); color:var(--fail); border-radius:8px; padding:10px 14px;
  margin:14px 0; display:none}
.footnote{margin-top:26px; font-size:12.5px; color:var(--muted); line-height:1.7}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>C06 云标定看板</h1>
    <span class="fresh"><span class="dot" id="dot"></span><span id="fresh">加载中…</span></span>
  </header>

  <div class="tiles">
    <div class="tile pass"><div class="n" id="n-pass">–</div><div class="l">已合格</div></div>
    <div class="tile run"><div class="n" id="n-run">–</div><div class="l">标定中</div></div>
    <div class="tile fail"><div class="n" id="n-fail">–</div><div class="l">失败待处理</div></div>
    <div class="tile"><div class="n" id="n-all">–</div><div class="l">总台数</div></div>
  </div>

  <div class="banner" id="banner"></div>

  <h2>✔ 已合格(按日期分组,今天在最上;块 = 同批开跑,没过的这批就缺席)</h2>
  <div id="g-pass"><div class="empty">暂无</div></div>

  <h2>⏳ 标定中</h2>
  <div class="grid" id="g-run"><div class="empty">暂无</div></div>

  <h2>✖ 失败(重录标定素材后重标)</h2>
  <div class="grid" id="g-fail"><div class="empty">暂无</div></div>

  <div class="footnote">
    判定 = 云端 kalibr 全流水线 run 结论(含角点率、基线等质量闸门)。
    有新结果后约 5~7 分钟上板;页面每 60 秒自动检查,时间为北京时间。
    测试板(sn9999…)不计入统计。
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let lastData=null;

function hhmm(iso){
  try{
    return new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",
      month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})
      .format(new Date(iso));
  }catch(e){ return iso||"–"; }
}

// 北京时间的日期键/标签(看板给工厂看,统一按 Asia/Shanghai 分组,与看的人手机时区无关)
function dayKeySh(iso){
  try{
    return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",
      year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(iso));
  }catch(e){ return "?"; }
}
function dayLabel(key){
  const today=dayKeySh(new Date().toISOString());
  const yest=dayKeySh(new Date(Date.now()-864e5).toISOString());
  const md=parseInt(key.slice(5,7),10)+"月"+parseInt(key.slice(8),10)+"日";
  if(key===today) return md+"(今天)";
  if(key===yest)  return md+"(昨天)";
  return md;
}

function chipEl(d){
  const c=document.createElement("div");
  c.className="chip "+(d.state==="pass"?"pass":d.state==="fail"?"fail":"run");
  let recheck="";
  if(d.state==="pass"&&d.orig_date){   // 复检:结果本体是 orig_date 那次合格
    c.classList.add("recheck");
    recheck="复检·原"+parseInt(d.orig_date.slice(5,7),10)+"-"+parseInt(d.orig_date.slice(8),10)+" · ";
  }
  const sn=document.createElement("span"); sn.className="b"; sn.textContent=d.sn;
  const meta=document.createElement("small");
  meta.textContent=recheck+(d.attempts>1?"第"+d.attempts+"次 · ":"")+hhmm(d.run_created_at);
  c.appendChild(sn); c.appendChild(meta);
  return c;
}

function render(data){
  const byTime=(a,b)=>a.run_created_at<b.run_created_at?1:-1;   // 新的在前
  const prod=(data.devices||[]).filter(d=>!d.is_test);
  const pick=s=>prod.filter(d=>s.indexOf(d.state)>=0);
  const groups={ "g-pass":pick(["pass"]), "g-run":pick(["running","queued"]), "g-fail":pick(["fail"]) };
  $("n-pass").textContent=groups["g-pass"].length;
  $("n-run").textContent=groups["g-run"].length;
  $("n-fail").textContent=groups["g-fail"].length;
  $("n-all").textContent=prod.length;

  // 标定中/失败:平铺,时间倒序
  for(const gid of ["g-run","g-fail"]){
    const el=$(gid); el.textContent="";
    const ds=groups[gid].slice().sort(byTime);
    if(!ds.length){ el.innerHTML='<div class="empty">暂无</div>'; continue; }
    for(const d of ds) el.appendChild(chipEl(d));
  }

  // 已合格:按日期分组(今天在最上);组内按【投料批次】分块 —— 同批 10 台在
  // 强机是并行同时开跑的,tag 里的开跑时间戳几乎相同,按它聚类(间隔>10 分钟
  // 或满 10 台开新块)。没过的机器这批自然缺席,后一批绝不补位;复检(结果沿用
  // 原日期的蓝色)单独归"复检"块,不混进生产批次。
  const hhmmSh=t=>new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",
    hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(t));
  function stampMs(d){
    // 批次锚点 = tag 开跑时间戳(北京时间);老数据没这字段,用 run 时间近似
    if(d.stamp&&/^\d{8}-\d{6}$/.test(d.stamp)){
      const s=d.stamp;
      return Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),
                      +s.slice(9,11)-8,+s.slice(11,13),+s.slice(13,15));
    }
    return new Date(d.run_created_at).getTime();
  }
  const el=$("g-pass"); el.textContent="";
  const ds=groups["g-pass"].slice().sort(byTime);
  if(!ds.length){ el.innerHTML='<div class="empty">暂无</div>'; }
  else {
    const today=dayKeySh(new Date().toISOString());
    const days=[], byDay={};
    for(const d of ds){
      const k=dayKeySh(d.run_created_at);
      if(!byDay[k]){ byDay[k]=[]; days.push(k); }
      byDay[k].push(d);
    }
    for(const k of days){
      const chips=byDay[k];
      const h=document.createElement("div");
      h.className="datehead"+(k===today?" today":"");
      const b=document.createElement("b"); b.textContent=dayLabel(k);
      const c=document.createElement("span"); c.className="cnt";
      c.textContent=chips.length+" 台";
      h.appendChild(b); h.appendChild(c);
      el.appendChild(h);
      const re=chips.filter(d=>d.orig_date);
      const normal=chips.filter(d=>!d.orig_date).sort((a,b)=>stampMs(a)-stampMs(b));
      const clusters=[]; let prev=null;
      for(const d of normal){
        const t=stampMs(d);
        if(!clusters.length || t-prev>600000 ||
           clusters[clusters.length-1].length>=10) clusters.push([]);
        clusters[clusters.length-1].push(d); prev=t;
      }
      for(let i=clusters.length-1;i>=0;i--){
        const cl=clusters[i];
        const bh=document.createElement("div"); bh.className="batchhead";
        bh.textContent=hhmmSh(stampMs(cl[0]))+" 开跑 · "+cl.length+" 台";
        el.appendChild(bh);
        const g=document.createElement("div"); g.className="grid";
        for(const d of cl.slice().sort(byTime)) g.appendChild(chipEl(d));
        el.appendChild(g);
      }
      if(re.length){
        const bh=document.createElement("div"); bh.className="batchhead re";
        bh.textContent="复检(结果沿用原日期) · "+re.length+" 台";
        el.appendChild(bh);
        const g=document.createElement("div"); g.className="grid";
        for(const d of re.sort(byTime)) g.appendChild(chipEl(d));
        el.appendChild(g);
      }
    }
  }
  const now=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",
    hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
  $("fresh").textContent="状态变化于 "+hhmm(data.generated_at)+" · 已检查 "+now;
}

async function tick(){
  try{
    const r=await fetch("data.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("http "+r.status);
    lastData=await r.json();
    render(lastData);
    $("dot").classList.remove("bad");
    $("banner").style.display="none";
  }catch(e){
    $("dot").classList.add("bad");
    $("banner").textContent="刷新失败("+e.message+"),显示的是上一次数据,60 秒后自动重试。";
    $("banner").style.display="block";
    if(lastData) render(lastData);
    else $("fresh").textContent="加载失败";
  }
}
tick();
setInterval(tick,60000);
</script>
</body>
</html>
